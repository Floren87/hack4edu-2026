# Comprueba tipos, tests, build y navegador en ramas de trabajo y PR de integración.
name: Comprobar app

on:
  pull_request:
    branches: [develop, main]
    paths: ['app/**', '.github/workflows/ci.yml']
  push:
    branches: [develop, 'feat/**', 'fix/**']
    paths: ['app/**', '.github/workflows/ci.yml']

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Instalar API de pruebas
        run: npm ci --prefix ../backend
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Probar interfaz y permisos con API en memoria
        run: npm run test:e2e
      - name: Guardar capturas si falla el navegador
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-navegador
          path: app/test-results/
          retention-days: 3
