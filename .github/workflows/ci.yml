# Comprueba la app en cada PR a develop o main: tipos, tests y build
name: Comprobar app

on:
  pull_request:
    branches: [develop, main]
    paths: ['app/**', '.github/workflows/ci.yml']
  push:
    branches: [develop]
    paths: ['app/**', '.github/workflows/ci.yml']

jobs:
  comprobar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
